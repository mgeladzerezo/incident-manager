{{- $component := dict "root" . "component" "api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "im.fullname" . }}-api
  labels:
    {{- include "im.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "im.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "im.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "im.podSecurityContext" . | nindent 6 }}
      {{- include "im.topologySpread" $component | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: {{ include "im.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          {{- include "im.backendEnv" . | nindent 10 }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          # Readiness includes the database, liveness does not: a database failover should
          # take the pod out of the Service, not restart it.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              # Give the ingress controller time to stop sending traffic before SIGTERM.
              sleep:
                seconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "im.containerSecurityContext" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "im.fullname" . }}-api
  labels:
    {{- include "im.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "im.selectorLabels" $component | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "im.fullname" . }}-api
  labels:
    {{- include "im.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "im.selectorLabels" $component | nindent 6 }}
