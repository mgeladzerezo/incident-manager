apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "im.fullname" . }}-backend
  labels:
    {{- include "im.labels" . | nindent 4 }}
data:
  IM_PUBLIC_URL: {{ .Values.config.publicUrl | quote }}
  IM_OIDC_ISSUER: {{ .Values.config.oidcIssuer | quote }}
  IM_OIDC_AUDIENCE: {{ .Values.config.oidcAudience | quote }}
  IM_GROUP_BY_LABELS: {{ .Values.config.groupByLabels | quote }}
  IM_SMTP_HOST: {{ .Values.config.smtp.host | quote }}
  IM_SMTP_PORT: {{ .Values.config.smtp.port | quote }}
  IM_SMTP_USERNAME: {{ .Values.config.smtp.username | quote }}
  IM_SMTP_FROM: {{ .Values.config.smtp.from | quote }}
  IM_SMTP_STARTTLS: {{ .Values.config.smtp.starttls | quote }}
  IM_WORKER_POLL_SECONDS: {{ .Values.config.workerPollSeconds | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "im.fullname" . }}-frontend
  labels:
    {{- include "im.labels" . | nindent 4 }}
data:
  config.js: |
    window.__APP_CONFIG__ = {
      apiBaseUrl: "/api/v1",
      oidcAuthority: {{ .Values.config.oidcIssuer | quote }},
      oidcClientId: {{ .Values.config.oidcClientId | quote }},
    };
