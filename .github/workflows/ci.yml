name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  # The unit tests run on SQLite. This job applies the migrations to a real PostgreSQL,
  # which is where a PostgreSQL-only mistake in a migration would show up.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: incident
          POSTGRES_PASSWORD: incident
          POSTGRES_DB: incident
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incident"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      IM_DATABASE_URL: postgresql+psycopg://incident:incident@localhost:5432/incident
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Fails if the committed API types no longer match what the backend serves.
  api-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python -m app.export_openapi ../frontend/openapi.json
        working-directory: backend
      - run: npm ci && npm run gen:api
        working-directory: frontend
      - run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt
        run: terraform fmt -check -recursive
        working-directory: deploy/terraform
      - name: terraform validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
        working-directory: deploy/terraform
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint deploy/helm/incident-manager -f deploy/helm/incident-manager/ci/test-values.yaml
      - name: helm template
        run: >-
          helm template incident-manager deploy/helm/incident-manager
          -f deploy/helm/incident-manager/ci/test-values.yaml > /dev/null
      # Reported, not enforced: the findings have not been triaged against a real scan yet.
      - name: trivy config scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: deploy
          severity: HIGH,CRITICAL
          exit-code: "0"

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          load: true
          tags: incident-manager-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
      - name: trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: incident-manager-${{ matrix.component }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
